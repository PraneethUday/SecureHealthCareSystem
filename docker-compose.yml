services:
  healthcare-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}

    container_name: secure-healthcare-system

    ports:
      - "3000:3000"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: 3000

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

    networks:
      - healthcare-network

networks:
  healthcare-network:
    driver: bridge
